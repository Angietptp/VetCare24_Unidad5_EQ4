name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vetcare
          POSTGRES_PASSWORD: vetcare_dev
          POSTGRES_DB: vetcare24_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetcare -d vetcare24_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://vetcare:vetcare_dev@localhost:5432/vetcare24_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest   # falla si la cobertura baja de 80 %
      - name: Generar evidencia del PIA (120 casos, 20 transiciones, CU-05 y OpenAPI)
        env:
          PYTHONPATH: src
        run: |
          python -m tests.evidencia_api docs/evidencia
          python -m tests.evidencia_emergencias docs/evidencia   # falla si algo no coincide
          python -m vetcare24.api.exportar_openapi docs/evidencia/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia
          path: docs/evidencia/

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose --profile tests config -q
      - name: Construir imagen de la aplicación
        run: docker build --target runtime -t vetcare24:ci .
      - name: Publicar en GHCR (solo en main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}
          docker tag vetcare24:ci "$IMG"
          docker push "$IMG"
