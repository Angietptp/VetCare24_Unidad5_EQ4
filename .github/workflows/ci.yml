name: CI Unidad 5

on:
  push:
    branches: [main]
  pull_request:

jobs:
  laboratorio:
    name: Laboratorio (CI Business Logic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_LABORATORIO_U5/laboratorio_U5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: pytest -v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - run: python -m compileall -q src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-laboratorio
          path: 01_LABORATORIO_U5/laboratorio_U5/htmlcov/

  vetcare-lint:
    name: VetCare 24 · lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_PIA_VETCARE24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  vetcare-test:
    name: VetCare 24 · pruebas
    runs-on: ubuntu-latest
    needs: vetcare-lint
    defaults:
      run:
        working-directory: 02_PIA_VETCARE24
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vetcare
          POSTGRES_PASSWORD: vetcare_dev
          POSTGRES_DB: vetcare24_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetcare -d vetcare24_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://vetcare:vetcare_dev@localhost:5432/vetcare24_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest   # falla si la cobertura baja de 80 %
      - name: Generar evidencia (120 casos, 20 transiciones, CU-05 y OpenAPI)
        env:
          PYTHONPATH: src
        run: |
          python -m tests.evidencia_api docs/evidencia
          python -m tests.evidencia_emergencias docs/evidencia
          python -m vetcare24.api.exportar_openapi docs/evidencia/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-vetcare24
          path: 02_PIA_VETCARE24/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-vetcare24
          path: 02_PIA_VETCARE24/docs/evidencia/

  vetcare-docker:
    name: VetCare 24 · Docker
    runs-on: ubuntu-latest
    needs: vetcare-test
    defaults:
      run:
        working-directory: 02_PIA_VETCARE24
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile tests config -q
      - run: docker build --target runtime -t vetcare24:ci .
